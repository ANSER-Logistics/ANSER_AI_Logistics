[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# test_server.py phải set ENV=LOCAL + sys.path TRƯỚC khi import app — E402 là chủ đích
"tests/test_server.py" = ["E402"]
# Script offline chạy độc lập: sys.path.insert TRƯỚC khi import src — E402 là chủ đích
"offline_training/*.py" = ["E402"]
# Router phải import SAU khi tạo app (routes đọc runtime của dependencies) — E402 chủ đích
"src/api/main.py" = ["E402"]
# Notebook: ô đầu là `!pip install`, import buộc phải nằm sau — E402 là bản chất
# của notebook, không phải nợ kỹ thuật.
"offline_training/*.ipynb" = ["E402"]
# Script đánh giá độc lập: sys.path.insert TRƯỚC khi import src — E402 chủ đích
"src/evaluate_system.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# Hai dòng dưới để `mypy offline_training` chạy được. Thư mục đó không có
# `__init__.py`, nhưng code trong nó import theo đường gói
# (`from offline_training.dgen_common import ...`), nên mypy thấy cùng một
# file dưới hai tên module và chết với "Source file found twice".
#
# Chọn cách này chứ KHÔNG thêm `offline_training/__init__.py`: mấy script đó
# chạy bằng `python offline_training/xxx.py` trên Colab, biến thư mục thành
# package có thể đổi cách Python nạp chúng ở đúng chỗ không ai test được.
mypy_path = "."
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
