# deploy/docker-compose.yml — dựng lại toàn bộ Brain bằng MỘT lệnh.
#
#     cd deploy && cp .env.example .env && nano .env && docker compose up -d
#
# KIẾN TRÚC: model chạy trong tiến trình RIÊNG, Brain gọi qua HTTP.
#
#   ┌─────────────┐   HTTP    ┌──────────────┐
#   │   brain     │──────────▶│  vllm-text   │  GPU ~62%   Qwen3-8B AWQ
#   │  (CPU only) │           └──────────────┘
#   │  FastAPI    │   HTTP    ┌──────────────┐
#   │  engine     │──────────▶│ vllm-vision  │  GPU ~25%   Qwen3-VL-2B
#   │  tất định   │           └──────────────┘
#   └─────────────┘
#
# Vì sao Brain KHÔNG cần GPU: mọi phần nặng nằm sau HTTP. Brain còn lại là
# FastAPI + các engine tất định (pricing, reporting, inventory, calibration) —
# toàn số học thuần. Hệ quả thực tế:
#   - image Brain nhẹ (không CUDA), build và restart tính bằng giây
#   - sửa code nghiệp vụ không phải nạp lại 6GB weights
#   - vLLM sập thì /health và /tools/* vẫn sống
#
# Embedder + reranker của RAG chạy CPU. Với vài trăm tài liệu thì thừa sức, và
# đổi lại là không phải tranh VRAM với model sinh.
#
# ⚠️ FILE NÀY CHƯA TỪNG ĐƯỢC CHẠY (tính đến 13/08/2026).
#
# Chỗ mô tả kiến trúc mà người triển khai cần biết trước khi tin file này:
#
#   1. `redis` — ĐÃ NỐI 09/11/2026 (#15): TASK_REGISTRY dùng Redis khi có
#      REDIS_URL; Redis lỗi thì lùi về RAM và /health báo `degraded`.
#   2. `vllm-vision` — CÓ client HTTP từ 09/11/2026 (#14), nhưng container nằm
#      trong profile `vision`, nên mặc định KHÔNG chạy. Vì vậy VLLM_VISION_BASE_URL
#      để RỖNG mặc định: `brain` khai `vision_backend: "none"` (tắt có tuyên bố),
#      không `degraded` vì gọi một container không tồn tại. Bật vision:
#          VLLM_VISION_BASE_URL=http://vllm-vision:8002   (trong .env)
#          docker compose --profile vision up -d
#      rồi `/health` phải báo `vision_backend: "server"`, `vllm_vision_server.ok`.
#
# `tests/contracts/test_deploy_config.py` giữ danh sách này đồng bộ với code: nối xong cái
# nào thì test đỏ, buộc phải sửa cả chú thích này.

services:
  vllm-text:
    # v0.11.2 — CÙNG bản với `vllm-vision` và với mọi phép đo (BR-04, BR-05,
    # phiên #13: `requirements-gpu.txt`, vllm>=0.10.2,<0.12). Ghim cứng vì API
    # vLLM trôi liên tục. Bản cũ v0.8.5 chưa ai đo grammar `guided_json`/`anyOf`
    # trên đó, và không còn cài được trên Python 3.13 của Colab (#35).
    # `tests/contracts/test_deploy_config.py` khoá: mọi image vLLM cùng một bản, và bản đó
    # nằm trong khoảng `requirements-gpu.txt` cho phép.
    image: vllm/vllm-openai:v0.11.2
    container_name: anser-vllm-text
    restart: unless-stopped
    environment:
      # Rỗng = để vLLM tự nhận từ `quantization_config` trong config.json —
      # đúng như đường trong tiến trình (src/core/config.py) và như phép đo, để
      # đo và chạy thật dùng CÙNG một nhân (awq_marlin thay vì awq bị ép).
      # Ép awq thì đặt luôn TEXT_DTYPE=half (nhân awq cũ chỉ nhận float16).
      TEXT_QUANTIZATION: ${TEXT_QUANTIZATION:-}
      TEXT_DTYPE: ${TEXT_DTYPE:-}
    # Qua shell để BỎ HẲN cờ khi biến rỗng: `--quantization=` rỗng là lỗi của
    # vLLM, và danh sách `command:` không bỏ được phần tử. `$$` là `$` để shell
    # TRONG container mở rộng, không phải compose.
    #   --max-model-len: BR-04, chốt 28/10/2026
    #   --disable-log-requests: P2, prompt chứa dữ liệu khách
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec vllm serve /models/${TEXT_MODEL_DIR:?thiếu TEXT_MODEL_DIR trong .env}
        --served-model-name=anser-v3
        --max-model-len=${TEXT_MAX_MODEL_LEN:-32768}
        --gpu-memory-utilization=${TEXT_GPU_FRACTION:-0.62}
        --port=8001
        --disable-log-requests
        $${TEXT_QUANTIZATION:+--quantization=$$TEXT_QUANTIZATION}
        $${TEXT_DTYPE:+--dtype=$$TEXT_DTYPE}
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    ports:
      - "127.0.0.1:8001:8001"                # CHỈ localhost — ra ngoài qua tunnel
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Nạp 6GB weights mất vài phút -> start_period rộng, đừng để compose
      # kết luận "unhealthy" trong lúc model còn đang nạp.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s

  # Giai đoạn 3b. Bật khi VLM đã sẵn sàng:  docker compose --profile vision up -d
  vllm-vision:
    # v0.11.2: bản đã chạy trong phiên Colab sạch (requirements-gpu.txt), cùng
    # bản với vllm-text. Qwen3-VL cần vLLM >= 0.11.0.
    image: vllm/vllm-openai:v0.11.2
    container_name: anser-vllm-vision
    profiles: ["vision"]
    restart: unless-stopped
    command:
      - --model=${VISION_MODEL_ID:-Qwen/Qwen3-VL-2B-Instruct}
      - --served-model-name=anser-vision
      - --max-model-len=${VISION_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization=${VISION_GPU_FRACTION:-0.25}
      - --limit-mm-per-prompt=image=2
      - --port=8002
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8002:8002"
    shm_size: "4gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 240s

  brain:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: anser-brain
    restart: unless-stopped
    environment:
      ENV: SERVER
      VLLM_BASE_URL: http://vllm-text:8001
      VLLM_MODEL: anser-v3
      # Rỗng mặc định vì `vllm-vision` thuộc profile `vision` (xem đầu file).
      # Đặt trong .env cùng lúc bật profile; quên một trong hai là /health báo
      # `degraded` (có URL mà container không chạy) hoặc vision tắt.
      VLLM_VISION_BASE_URL: ${VLLM_VISION_BASE_URL:-}
      VLLM_VISION_MODEL: anser-vision
      # Ngưỡng điều tiết tải — PHẢI đo lại trên máy thật, xem README §5.
      ANSER_TEXT_MAX_CONCURRENT: ${TEXT_MAX_CONCURRENT:-4}
      ANSER_TEXT_MAX_QUEUE: ${TEXT_MAX_QUEUE:-16}
      ANSER_TEXT_WAIT_TIMEOUT_S: ${TEXT_WAIT_TIMEOUT_S:-20}
      # Ngưỡng p95 trên /health (#9). Chỉ ms/token "chưa đạt" hạ `degraded`;
      # tổng ms chỉ báo cáo. Xem src/core/nguong_p95.py.
      P95_MS_MOI_TOKEN: ${P95_MS_MOI_TOKEN:-60}
      P95_NGUONG_MS: ${P95_NGUONG_MS:-5000}
      P95_CUA_SO: ${P95_CUA_SO:-200}
      P95_MAU_TOI_THIEU: ${P95_MAU_TOI_THIEU:-30}
      # Tuổi giá dầu (AGENTS §3.1c): cũ từ WARN ngày thì cảnh báo, từ MAX ngày thì
      # /tools/quote trả 422. RỖNG = mặc định trong src/core/pricing.py, nên con số
      # mặc định chỉ sống ở MỘT nơi (R4). Hỏng thì dịch vụ không khởi động.
      FUEL_PRICE_WARN_DAYS: ${FUEL_PRICE_WARN_DAYS:-}
      FUEL_PRICE_MAX_DAYS: ${FUEL_PRICE_MAX_DAYS:-}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:-}
      # TÊN BIẾN PHẢI LÀ API_AUTH_TOKEN — đó là tên `dependencies.py` đọc.
      #
      # Bản trước đặt `API_TOKEN`, và `require_api_token` bỏ qua mọi kiểm tra khi
      # biến nó đọc rỗng. Hậu quả: triển khai đúng theo README vẫn dựng ra một
      # Brain KHÔNG kiểm token nào, lại đưa thẳng ra Internet qua Cloudflare
      # tunnel — trong khi người vận hành vừa bị `:?` bắt điền token nên đinh
      # ninh là đã khoá. Phát hiện 13/08/2026 khi chạy test nội bộ qua HTTP thật.
      #
      # `tests/contracts/test_deploy_config.py` khoá lại chuyện này: nó đọc chính file
      # compose và đối chiếu với tên biến mà code gọi os.getenv.
      API_AUTH_TOKEN: ${API_TOKEN:?thiếu API_TOKEN trong .env}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      # HMAC từng yêu cầu (A6, src/api/hmac_auth.py). off = như cũ; log = vẫn bắt token cũ, chỉ ghi nhận chữ ký; enforce = bắt
      # buộc chữ ký, token cũ hết là đường vào. Khoá mỗi bên gọi một biến API_HMAC_KEY_<ID> (key id = <id> chữ thường, "_" thành
      # "-"), từ 32 ký tự; xoay khoá bằng cách đặt thêm API_HMAC_KEY_BODY_2. RỖNG = tắt khoá đó. Khoá là BÍ MẬT: chỉ trong .env.
      API_HMAC_MODE: ${API_HMAC_MODE:-off}
      API_HMAC_KEY_BODY: ${API_HMAC_KEY_BODY:-}
      API_HMAC_KEY_N8N: ${API_HMAC_KEY_N8N:-}
      # Thăm dò chủ động model (A21, src/core/llm_suc_khoe.py): một lượt sinh MỘT token mỗi N giây; mất kết nối thì /chat trả 503 llm_unavailable
      # và /tools/* vẫn chạy. RỖNG = mặc định 60; 0 = tắt. Giá trị hỏng thì dịch vụ không khởi động.
      LLM_PROBE_INTERVAL_S: ${LLM_PROBE_INTERVAL_S:-}
      # Giới hạn độ dài chuỗi trong grammar workflow n8n (#91, src/core/workflow_schema.py). RỖNG/0 = TẮT (production không đổi). Chỉ bật (600)
      # sau khi Thành đo trên vLLM thật: xgrammar phải biên dịch được schema đệ quy.
      WORKFLOW_GRAMMAR_MAX_STRING: ${WORKFLOW_GRAMMAR_MAX_STRING:-}
      # Bốn biến dưới đây ĐỔI HÀNH VI THẬT, và trước 04/11/2026 không có mặt
      # ở compose lẫn .env.example — nên đặt chúng trong .env KHÔNG có tác
      # dụng gì, vì chúng không tới được container.
      #
      # Rỗng = đúng hành vi hiện tại. Truyền qua đây chỉ làm chúng CẤU HÌNH
      # ĐƯỢC, không bật gì cả — cùng nếp với DATABASE_URL và VLLM_API_KEY ở
      # trên.
      #
      # Nặng nhất là cái đầu: thiếu nó thì nhánh LOGISTICS trả lời "Hệ thống
      # báo giá chưa được nối với n8n" — tức nghiệp vụ ƯU TIÊN 1 (AGENTS §8)
      # chết, trong khi tên biến cần đặt không xuất hiện ở bất kỳ file triển
      # khai nào.
      N8N_QUOTE_WEBHOOK_URL: ${N8N_QUOTE_WEBHOOK_URL:-}
      # Phải KHỚP `BRAIN_KB_WORKSPACE` bên Body. Lệch thì tra sai kho tri
      # thức — xem cảnh báo đầu src/api/routes/knowledge.py.
      KB_WORKSPACE_ID: ${KB_WORKSPACE_ID:-default}
      # Workflow n8n THẬT của Body (#20), tải bằng
      #   python offline_training/dong_bo_n8n_body.py tai   -> deploy/n8n-body/
      # và mount ở /app/n8n-body (volumes dưới). Chưa tải thì thư mục rỗng,
      # Brain tự lùi về catalog dự phòng và ghi log cảnh báo — không sập.
      N8N_TEMPLATES_DIR: ${N8N_TEMPLATES_DIR:-/app/n8n-body}
      # Rỗng = TẮT webhook chủ động. Đặt URL là BẬT một lời gọi ra ngoài mang
      # theo câu trả lời của AI — đọc kỹ trước khi điền.
      BODY_CALLBACK_URL: ${BODY_CALLBACK_URL:-}
    volumes:
      - ../src/data/docs:/app/src/data/docs:ro
      - vector-db:/app/data/vector_db
      - ./n8n-body:/app/n8n-body:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      vllm-text:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: anser-redis
    restart: unless-stopped
    # TASK_REGISTRY hiện là dict trong RAM: mất sạch khi restart, và sai hoàn
    # toàn nếu chạy nhiều worker. Redis là chỗ giữ trạng thái tác vụ nền.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data

  # Đưa Brain ra Internet mà KHÔNG mở cổng nào trên máy thuê: không IP tĩnh,
  # không cấu hình tường lửa, không tự lo chứng chỉ TLS.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: anser-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?thiếu CLOUDFLARE_TUNNEL_TOKEN trong .env}
    depends_on:
      brain:
        condition: service_started

volumes:
  vector-db:
  redis-data:
  hf-cache:
