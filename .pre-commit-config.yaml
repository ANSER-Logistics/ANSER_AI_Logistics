# .pre-commit-config.yaml — cổng chất lượng chạy trên MÁY DEV.
#
#     pip install -r requirements-dev.txt
#     pre-commit install
#
# VÌ SAO CÓ FILE NÀY
# ------------------
# Nó bắt lỗi hình thức TRƯỚC KHI commit, nên vòng phản hồi ngắn hơn chờ CI.
# Lớp thứ hai, không phải lớp duy nhất.
#
# LỊCH SỬ — vì sao nó từng là lớp DUY NHẤT
# ----------------------------------------
# BIEN_BAN_CHU_KY_01 mục 6 (29/10/2026): GitHub Actions của repo có 136 lượt và
# 0 lượt xanh, mọi job dừng ở "your account is locked due to a billing issue".
# Lúc đó KHÔNG cổng tự động nào hoạt động, và mọi câu "CI xanh" trong tài liệu
# cũ không có lượt chạy nào chứng minh. File này ra đời để lấp chỗ đó.
#
# CI ĐÃ CHẠY LẠI — 03/11/2026 lúc 18:33
# -------------------------------------
# Đo 04/11: lượt đỏ cuối cùng 03/11 17:33, lượt xanh đầu tiên 18:33, và từ đó
# 21 lượt xanh liên tiếp. Nguyên nhân cũ là
# "Invalid payment method — authorization hold failed" ở trang Billing của tài
# khoản chủ repo; chủ dự án đã xử lý.
#
# Nên file này KHÔNG còn là phương án tạm. Nó vẫn đáng giữ: `--no-verify` bỏ
# qua được, chỉ chạy trên máy ai đã `pre-commit install`, nhưng nó báo lỗi
# trong vài giây thay vì vài phút.
#
# shortcut: không chạy pytest ở hook vì gần 1300 test mất khoảng một phút, quá
#           chậm cho mỗi lần commit — và giờ CI chạy được thì phần đó để CI lo.
#           Chạy tay `ENV=LOCAL pytest -q` trước khi đẩy nếu muốn chắc.

# CHƯA TỪNG ĐƯỢC COMMIT cho tới 07/11/2026.
#
# File này nằm trong thư mục làm việc nhưng `git ls-files` không thấy nó, và
# `.gitignore` cũng không chặn — đơn giản là chưa ai `git add`. Hệ quả: ai clone
# repo cũng KHÔNG có hook nào, kể cả hook quét secret.
#
# Điều đó quan trọng hơn vẻ ngoài của nó. `quet_secret_pre_commit.py` (112 dòng)
# được viết riêng cho R2b — ràng buộc ra đời sau một lần lộ mật khẩu Neon lên
# GitHub public. Một bộ quét secret chỉ chạy trên máy người viết ra nó thì không
# bảo vệ được ai.
#
# Và hai hook dưới đây ĐÃ LỆCH khỏi CI (sửa cùng ngày):
#   ruff  — thiếu launch_demo.py và execute_backup_and_push.py
#   mypy  — còn danh sách 5 file cũ, trong khi CI đã soi `src offline_training`
#
# Chính chú thích trong file này cảnh báo đúng chuyện đó: "Hai nguồn khác nhau
# thì máy dev và CI chấm theo hai luật khác nhau — đúng loại lệch mà R4 cấm."

default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # Dùng hook cục bộ chứ không dùng `repos: https://github.com/astral-sh/ruff-pre-commit`:
  # bản ruff ở đó do file này ghim, còn bản CI dùng là bản trong requirements-dev.
  # Hai nguồn khác nhau thì máy dev và CI chấm theo hai luật khác nhau — đúng
  # loại lệch mà R4 cấm. Gọi ruff/mypy của chính môi trường đang dùng.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (đúng phạm vi CI)
        entry: ruff check
        language: system
        pass_filenames: false
        always_run: true
        args: [src, tests, offline_training, launch_demo.py, execute_backup_and_push.py]

      - id: mypy
        name: mypy (đúng danh sách CI)
        entry: mypy
        language: system
        pass_filenames: false
        always_run: true
        args: [src, offline_training]

      # Quét secret trước khi commit. R2b nói credential đã lộ là credential đã
      # chết, nên chặn ở đây rẻ hơn mọi thứ làm sau.
      - id: quet-secret
        name: quét secret trong file sắp commit
        entry: python offline_training/quet_secret_pre_commit.py
        language: system
        pass_filenames: true
