name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # CHỦ ĐÍCH không cài requirements.txt đầy đủ: torch/vllm/chromadb quá nặng
        # cho CI và ENV=LOCAL không cần chúng (manager.py đã import lười — thiếu
        # torch thì router lùi về lớp từ khoá, suite vẫn chạy đủ).
        # Danh sách dưới = đúng những gì tầng API + tầng tất định import trực tiếp.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install fastapi httpx pydantic numpy json_repair sqlalchemy requests ddgs python-multipart openpyxl
      # BR-07 (chu kỳ 01): cả ba thư mục, không còn danh sách file chọn tay. Bản
      # cũ chỉ soi chín file nên không thấy tám lỗi sửa ngày 22/10 — trong đó
      # một F821 làm notebook Colab ném NameError giữa phiên đo, sau khi đã nạp
      # xong model. Script offline chạy trên GPU đắt tiền: lỗi phải chết ở đây.
      - name: Ruff
      # Them hai script o GOC REPO (04/11/2026). Chung tung nam ngoai MOI cong
      # tu dong — khong ruff, khong mypy, khong test quy tac code — va do duoc
      # 25 loi ruff, trong do mot F841 che mot loi DO LUONG trong watchdog VRAM
      # cua launch_demo.py: no tinh ca `allocated` lan `reserved` roi canh bao
      # theo `allocated`, tuc bao muon hoac khong bao gi.
      #
      # `execute_backup_and_push.py` la script AGENTS §6.3 bao NGUOI DUNG chay,
      # vao dung luc te nhat de no hong: cuoi giai doan, luc sao luu va push.
      # Mot F821 o do lam mat chinh buoc bao ve cong viec.
      #
      # KHONG them chung vao tests/test_quy_tac_code.py: ca hai la script chay
      # tuong tac nen `print` la cach xuat DUNG o do, giong moi script trong
      # offline_training/. Quy tac "khong print" la quy tac cua SERVICE.
        run: ruff check src tests offline_training launch_demo.py execute_backup_and_push.py
      # CẢ HAI thư mục, không còn file nào chọn tay (04/11/2026). Lịch sử:
      # danh sách cũ soi 5 trên 83 file nguồn — 6% — nên bước này nhận xanh
      # mà gần như không kiểm gì.
      #
      # `mypy offline_training` chỉ chạy được nhờ `mypy_path` +
      # `explicit_package_bases` trong pyproject.toml: thư mục không có
      # __init__.py nhưng code trong nó import `offline_training.dgen_common`,
      # nên mypy thấy cùng một file dưới hai tên module. Lý do chọn cách đó
      # thay vì thêm __init__.py nằm ngay tại chỗ cấu hình.
      #
      # offline_training/ chạy trên GPU thuê tính tiền theo giờ (R3). Một
      # NameError giữa phiên đo, sau khi đã nạp xong model, là tiền đã trả
      # cho một phiên chết. Đúng loại lỗi bộ kiểm tĩnh bắt được miễn phí.
      - name: Mypy
        run: mypy src offline_training
      - name: Pytest
        env:
          ENV: LOCAL
        run: pytest -q
      # Dựng lại dataset từ nguồn trong repo rồi chạy preflight. Bắt sớm việc
      # đổi prompt/schema/catalog mà quên sinh lại dữ liệu train (P4) — đúng
      # loại lỗi chỉ lộ ra sau 2 tiếng train trên Colab.
      - name: Dataset preflight
        env:
          ENV: LOCAL
        run: |
          python offline_training/make_extraction_seeds.py --n 60 --n-eval 10
          python offline_training/make_n8n_pairs.py
          python offline_training/build_dataset_v3.py
          python offline_training/preflight_check.py
