name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # CHỦ ĐÍCH không cài requirements.txt đầy đủ: torch/vllm/chromadb quá nặng
        # cho CI và ENV=LOCAL không cần chúng (manager.py đã import lười — thiếu
        # torch thì router lùi về lớp từ khoá, suite vẫn chạy đủ).
        # Danh sách dưới = đúng những gì tầng API + tầng tất định import trực tiếp.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install fastapi httpx pydantic numpy json_repair sqlalchemy requests ddgs python-multipart openpyxl
      # BR-07 (chu kỳ 01): cả ba thư mục, không còn danh sách file chọn tay. Bản
      # cũ chỉ soi chín file nên không thấy tám lỗi sửa ngày 22/10 — trong đó
      # một F821 làm notebook Colab ném NameError giữa phiên đo, sau khi đã nạp
      # xong model. Script offline chạy trên GPU đắt tiền: lỗi phải chết ở đây.
      - name: Ruff
        run: ruff check src tests offline_training
      # TOÀN BỘ src/ chứ không còn 5 file chọn tay (04/11/2026). Danh sách cũ
      # soi 5 trên 83 file nguồn — 6% — nên bước này nhận xanh mà gần như
      # không kiểm gì. Lỗi đáng giá nhất tìm được khi mở rộng KHÔNG nằm trong
      # các lỗi mypy báo: nó nằm ở chỗ RuntimeState khai cả sáu trường là
      # Optional[object], khiến bộ kiểm kiểu im lặng trên đúng sáu thứ quan
      # trọng nhất của runtime. Khai kiểu thật xong thì nó chỉ ra ngay hai chỗ
      # truy cập None không được chặn.
      #
      # offline_training/ vẫn là danh sách chọn tay: cả thư mục còn 31 lỗi, và
      # `mypy offline_training` báo "Source file found twice" vì thư mục không
      # có __init__.py trong khi code import `offline_training.dgen_common`.
      # Cần MYPYPATH=. --explicit-package-bases. Ghi thành việc riêng.
      - name: Mypy
        run: mypy src offline_training/providers.py offline_training/chay_thu_live.py offline_training/bat_lai_brain.py
      - name: Pytest
        env:
          ENV: LOCAL
        run: pytest -q
      # Dựng lại dataset từ nguồn trong repo rồi chạy preflight. Bắt sớm việc
      # đổi prompt/schema/catalog mà quên sinh lại dữ liệu train (P4) — đúng
      # loại lỗi chỉ lộ ra sau 2 tiếng train trên Colab.
      - name: Dataset preflight
        env:
          ENV: LOCAL
        run: |
          python offline_training/make_extraction_seeds.py --n 60 --n-eval 10
          python offline_training/make_n8n_pairs.py
          python offline_training/build_dataset_v3.py
          python offline_training/preflight_check.py
