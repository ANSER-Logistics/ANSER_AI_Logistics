name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # CHỦ ĐÍCH không cài requirements.txt đầy đủ: torch/vllm/chromadb quá nặng
        # cho CI và ENV=LOCAL không cần chúng (manager.py đã import lười — thiếu
        # torch thì router lùi về lớp từ khoá, suite vẫn chạy đủ).
        # Danh sách dưới = đúng những gì tầng API + tầng tất định import trực tiếp.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Them `python-multipart` va `openpyxl` (07/11/2026). Thieu chung thi
          # buoc Pytest DO ngay o khau THU TEST, truoc khi chay mot ca nao:
          #
          #   RuntimeError: Form data requires "python-multipart" to be installed.
          #
          # Bon file test khong thu duoc: test_server.py, test_server_basics.py,
          # test_pricing_and_tools.py, test_assistant_upgrades.py. Ca bon deu dung
          # TestClient tren mot app co endpoint nhan file tai len, va FastAPI doi
          # goi do ngay luc khai bao route chu khong phai luc goi.
          #
          # CI cua nhanh `main` do vi ly do nay, va khong ai thay: moi viec dang
          # dien ra tren nhanh tinh nang, noi ci.yml da co hai goi nay tu truoc.
          pip install fastapi httpx pydantic numpy json_repair sqlalchemy requests ddgs python-multipart openpyxl
      - name: Ruff
        run: |
          ruff check src/core/tools.py src/core/memory.py src/core/context.py tests
          ruff check src/core/reporting.py src/core/metrics.py src/agents/agentic.py
      - name: Mypy
        run: mypy src/core/tools.py src/core/memory.py src/core/context.py
      - name: Pytest
        env:
          ENV: LOCAL
        run: pytest -q
      # Dựng lại dataset từ nguồn trong repo rồi chạy preflight. Bắt sớm việc
      # đổi prompt/schema/catalog mà quên sinh lại dữ liệu train (P4) — đúng
      # loại lỗi chỉ lộ ra sau 2 tiếng train trên Colab.
      - name: Dataset preflight
        env:
          ENV: LOCAL
        run: |
          python offline_training/make_extraction_seeds.py --n 60 --n-eval 10
          python offline_training/make_n8n_pairs.py
          python offline_training/build_dataset_v3.py
          python offline_training/preflight_check.py
